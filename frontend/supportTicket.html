<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./supportTicket.css" />
    <title>PetPal - Support Tickets</title>
    <!-- Material Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>

  <body>
    <header class="main-header">
      <a href="#" class="logo-link dashboard-link">
        <div class="logo-container">
          <h1 class="logo-text">petpal</h1>
          <p class="tagline">F O R A L L Y O U R P E T N E E D S</p>
        </div>
      </a>
      <div class="profile">
        <div class="profile-info">
          <p>Greetings, <b><span id="user-role">User</span></b></p>
        </div>
        <div class="profile-photo">
          <img src="./img/profile_pic.png" alt="Profile Picture" />
        </div>
      </div>
      <div class="title">
        <h1>Support Tickets</h1>
      </div>
    </header>

    <div class="support-ticket">
      <form id="supportForm" action="php/submitSupportTicket.php" method="POST">
        <label for="supportTitle">Title:</label>
        <input
          type="text"
          id="supportTitle"
          name="title"
          placeholder="Support Issue"
          required
          minlength="5"
          maxlength="100"
        />

        <label for="supportDescription">Description:</label>
        <textarea
          id="supportDescription"
          name="description"
          placeholder="Description for Issue"
          required
          minlength="10"
          maxlength="500"
        ></textarea>

        <input
          type="submit"
          id="submitBtn"
          value="Submit"
          class="btn"
        />
      </form>
    </div>   

    <script src="./script.js"></script>
    
    
  </body>
</html>
