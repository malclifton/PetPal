<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetPal - For All Your Pet Needs</title>
  <link rel="stylesheet" href="index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script src="https://kit.fontawesome.com/3efec73f4e.js" crossorigin="anonymous">

  </script>
</head>

<body>
  <header class="main-header">
    <a href="index.html" class="logo-link">
      <div class="logo-container">
        <h1 class="logo-text">petpal</h1>
        <p class="tagline">F O R A L L Y O U R P E T N E E D S</p>
      </div>
    </a>

    <div class="header-actions">
      <button class="login-button" onclick="window.location.href = './signUp.html';" aria-label="Register">
        <span class="login-text">Register</span>
      </button>
      <button class="login-button" onclick="window.location.href = './signIn.html';" aria-label="Login">
        <span class="login-text">Login</span>
      </button>
    </div>
  </header>

  <div class="container">
    <div class="image-container">
      <img src="./img/5.jpg" alt="PetPal Image" class="form-image">
    </div>

    <div class="container">
      <h2 class="form-title">Create an Account</h2>
      <form action="./php/signUp.php" method="post" enctype="multipart/form-data">
        <input type="text" id="fullName" name="fullName" placeholder="Full Name" />
        <input type="email" id="email" name="email" placeholder="Email Address" />
        <input type="password" id="password" name="password" placeholder="Password" />
        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Phone Number" />
        <div class="radio-group">
          <input type="radio" id="owner" name="role" value="Owner" class="radio-input" />
          <label for="owner" class="radio-label"><i class="fas fa-dog"></i> Pet Owner</label>

          <input type="radio" id="sitter" name="role" value="Sitter" class="radio-input" />
          <label for="sitter" class="radio-label"><i class="fas fa-users	"></i> Pet Sitter</label>
        </div>
        <div id="ownerFields" class="role-fields" style="display: none;">
          <input type="text" name="ownerAddress" placeholder="Home Address" />
          <label for="ownerProfileImage">Profile Image</label>
          <input type="file" id="ownerProfileImage" name="ownerProfileImage" accept="image/*" />
        </div>

        <div id="sitterFields" class="role-fields" style="display: none;">
          <input type="number" name="experienceYears" placeholder="Years of Experience" min="0" />
          <textarea name="availability" placeholder="Availability (e.g., Mon-Fri 9am-5pm)"></textarea>
          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" placeholder="Tell us about yourself..."></textarea>
          <label for="profileImage">Profile Image</label>
          <input type="file" id="profileImage" name="profileImage" accept="image/*" />
        </div>
        <input type="submit" id="submit" name="submit" value="Submit" class="btn" />
      </form>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const ownerRadio = document.getElementById("owner");
        const sitterRadio = document.getElementById("sitter");
        const ownerFields = document.getElementById("ownerFields");
        const sitterFields = document.getElementById("sitterFields");

        function toggleFields() {
          ownerFields.style.display = ownerRadio.checked ? "block" : "none";
          sitterFields.style.display = sitterRadio.checked ? "block" : "none";
        }

        ownerRadio.addEventListener("change", toggleFields);
        sitterRadio.addEventListener("change", toggleFields);
      });
    </script>

</body>

</html>
