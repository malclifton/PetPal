<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetPal - Habit Tracker</title>
    <link rel="stylesheet" href="./styles2.css" />
    <link rel="stylesheet" href="./css/material-icons.css">
</head>

<body>
    <div class="container">
        <aside>
            <div class="top">
                <div class="logo">
                    <img src="./img/logo.png" />
                    <a href="index.html" class="logo-link">
                        <div class="logo-container">
                            <h1 class="logo-text">petpal</h1>
                            <p class="tagline">F O R A L L Y O U R P E T N E E D S</p>
                        </div>
                    </a>
                </div>
                <div class="close" id="close-btn">
                    <span class="material-icons">close</span>
                </div>
            </div>

            <div class="sidebar">
                <a href="./petOwnerDashboard.html">
                    <span class="material-icons">home</span>
                    <h3>Dashboard</h3>
                </a>
                <a href="./petProfile.html">
                    <span class="material-icons">pets</span>
                    <h3>Pet Profile</h3>
                </a>
                <a href="./habitTracker.html">
                    <span class="material-icons">event_note</span>
                    <h3>Habit Tracker</h3>
                </a>
                <a href="./hirePetSitter.html" class="active"><span class="material-icons">notifications_active</span>
                    <h3>Community</h3>
                </a>
                <a href="#"><span class="material-icons">help</span>
                    <h3>Support Center</h3>
                </a>
                <a href="#"><span class="material-icons">exit_to_app</span>
                    <h3>Logout</h3>
                </a>
            </div>
        </aside>

        <main>
            <h1>Pet Owners</h1>
            <div id="owner-list"></div>
            <div id="chat-modal" class="modal">
                <div id="chat-box" class="chat-box">
                    <h2 id="chat-header"></h2>
                    <div id="messages" class="chat-messages"></div>
                    <textarea id="message-input" placeholder="Type your message..."></textarea>
                    <div class="chat-buttons">
                        <button onclick="sendMessage()">Send</button>
                        <button onclick="closeChat()">Close Chat</button>
                    </div>
                </div>
            </div>

            <h1>Pet Sitters</h1>
            <div id="sitter-list"></div>

        </main>
        <div class="right">
            <div class="top">
                <button id="menu-btn">
                    <span class="material-icons">menu</span>
                </button>
                <div class="theme-toggler">
                    <span class="material-icons active">white-balance-sunny</span>
                    <span class="material-icons">weather-night</span>
                </div>
                <div class="profile">
                    <div class="profile-info">
                        <p>Greetings, <b id="owner-name">Owner</b></p>
                    </div>
                    <div>
                        <div class="profile-photo">
                            <form id="profileImageForm" enctype="multipart/form-data">
                                <input type="file" name="newProfileImage" id="newProfileImage" accept="image/*"
                                    style="display: none;" />
                                <label for="newProfileImage">
                                    <img id="profileImage" src="./img/profile_pic.png" alt="Profile Image"
                                        style="cursor: pointer;" />
                                </label>
                            </form>
                        </div>
                    </div>
                </div>
                <script src="./index2.js"></script>
            </div>

        </div>
    </div>
    <script>
        let ownerId = null;

        fetch('./php/getSessionUser.php')
            .then(res => res.json())
            .then(data => {
                ownerId = data.user_id;
                loadSitters();
                loadOwners();
            });
        let currentSitterId = null;
        let currentOwnerChatId = null;

        function loadSitters() {
            fetch("./php/getSitters.php")
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return res.json();
                })
                .then(data => {
                    const sitterList = document.getElementById("sitter-list");
                    sitterList.innerHTML = "";
                    data.forEach(sitter => {
                        const btn = document.createElement("button");
                        const card = document.createElement("div");
                        card.classList.add("sitter-card");

                        card.innerHTML = `
  <img src="${sitter.profile_image || './img/profile_pic.png'}" alt="${sitter.name}" class="sitter-img" />
  <h3>${sitter.name}</h3>
  <p><strong>Experience:</strong> ${sitter.experience_years} years</p>
  <p><strong>Availability:</strong> ${sitter.availability}</p>
  <p>${sitter.bio || ""}</p>
  <button class="contact-btn">Message</button>
`;

                        card.querySelector("button").onclick = () => openChat(sitter);
                        sitterList.appendChild(card);
                        btn.onclick = () => openChat(sitter);
                    });
                })
                .catch(error => {
                    console.error('There was an error fetching the sitters:', error);
                });

        }
        function loadOwners() {
            fetch("./php/getOwners.php")
                .then(res => res.json())
                .then(data => {
                    const ownerList = document.getElementById("owner-list");
                    ownerList.innerHTML = "";
                    data.forEach(owner => {
                        const card = document.createElement("div");
                        card.classList.add("owner-card");

                        card.innerHTML = `
                    <img src="${owner.profile_image || './img/profile_pic.png'}" alt="${owner.name}" class="owner-img" />
                    <h3>${owner.name}</h3>
                    <p><strong>Email:</strong> ${owner.email}</p>
                    <button class="contact-btn" onclick="startChatWithOwner(${owner.owner_id}, '${owner.name}')">Message</button>
                `;

                        ownerList.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Error fetching owners:', error);
                });
        }
        function startChatWithOwner(ownerId, name) {
            currentOwnerChatId = ownerId;
            currentSitterId = null;
            document.getElementById("chat-header").textContent = `Chat with ${name}`;
            document.getElementById("chat-modal").style.display = "flex";
            fetchOwnerMessages();
        }

        function fetchOwnerMessages() {
            fetch(`./php/getOwnerMessages.php?owner1_id=${ownerId}&owner2_id=${currentOwnerChatId}`)
                .then(res => res.json())
                .then(data => {
                    const messagesDiv = document.getElementById("messages");
                    messagesDiv.innerHTML = "";
                    data.forEach(msg => {
                        const p = document.createElement("p");
                        p.innerHTML = `<strong>${msg.sender}:</strong> ${msg.message}`;
                        messagesDiv.appendChild(p);
                    });
                });
        }



        function openChat(sitter) {
            currentSitterId = sitter.sitter_id;
            document.getElementById("chat-header").textContent = `Chat with ${sitter.name}`;
            document.getElementById("chat-modal").style.display = "flex";
            fetchMessages();
        }
        function closeChat() {
            document.getElementById("chat-modal").style.display = "none";
            currentSitterId = null;
            currentOwnerChatId = null;
        }

        function fetchMessages() {
            fetch(`./php/getMessages.php?owner_id=${ownerId}&sitter_id=${currentSitterId}`)
                .then(res => res.json())
                .then(data => {
                    const messagesDiv = document.getElementById("messages");
                    messagesDiv.innerHTML = "";
                    data.forEach(msg => {
                        const p = document.createElement("p");
                        p.innerHTML = `<strong>${msg.sender}:</strong> ${msg.message}`;
                        messagesDiv.appendChild(p);
                    });
                });
        }

        function sendMessage() {
            const msg = document.getElementById("message-input").value.trim();
            if (!msg) return;

            const endpoint = currentSitterId ? "./php/sendMessage.php" : "./php/sendOwnerMessage.php";
            const body = {
                sender_id: ownerId,
                receiver_id: currentSitterId || currentOwnerChatId,
                sender_type: currentSitterId ? "owner" : undefined,
                message: msg
            };

            fetch(endpoint, {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            }).then(() => {
                document.getElementById("message-input").value = "";
                const fetchFn = currentSitterId ? fetchMessages : fetchOwnerMessages;
                fetchFn();
                setTimeout(() => {
                    const msgBox = document.getElementById("messages");
                    msgBox.scrollTop = msgBox.scrollHeight;
                }, 100);
            });
        }


        window.onclick = function (event) {
            const modal = document.getElementById("chat-modal");
            const box = document.getElementById("chat-box");
            if (event.target === modal) {
                closeChat();
            }
        };

    </script>
</body>

</html>
